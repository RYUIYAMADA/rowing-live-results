# 2026-11-15 直近3回失敗のため手動実行だけに。理由: 検証が失敗し続けている休眠リポ（大会終了後・最終更新から長期間）。必要な時に手動で実行
name: JSONバリデーション

on:
  workflow_dispatch:


jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: E2Eテスト実行
        run: python3 test/e2e_test.py --skip-pipeline
        # --skip-pipeline オプション: CSV→JSON変換をスキップしてJSONのみ検証
